# grafana.go-mmit.site — 모니터링 UI

server {
  listen 443 ssl;
  http2 on;
  server_name grafana.go-mmit.site;

  ssl_certificate     /etc/nginx/certs/origin.pem;
  ssl_certificate_key /etc/nginx/certs/origin.key;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  # grafana.htpasswd 는 커밋 안 됨(.gitignore), grafana.htpasswd.example 참고해서 로컬 생성.
  auth_basic           "gommit grafana";
  auth_basic_user_file /etc/nginx/conf.d/grafana.htpasswd;

  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto https;
  proxy_http_version 1.1;

  location / {
    set $grafana_upstream grafana:3000;
    proxy_pass http://$grafana_upstream;
  }

  # Grafana Live(대시보드 실시간 갱신) — 웹소켓 업그레이드
  location /api/live/ {
    set $grafana_upstream grafana:3000;
    proxy_pass http://$grafana_upstream;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
