user  nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  log_format main '$remote_addr $http_cf_connecting_ip - [$time_local] '
                  '"$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" '
                  'rt=$request_time uct=$upstream_connect_time urt=$upstream_response_time';
  access_log /var/log/nginx/access.log main;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  server_tokens off;

  # 업로드 상한 (Q25). Spring multipart(15MB)보다 커야 Spring 이 에러 응답을 줄 수 있음.
  client_max_body_size 20m;

  # 실제 클라이언트 IP = Cloudflare 가 넘기는 CF-Connecting-IP.
  # (Cloudflare IPv4 대역 — https://www.cloudflare.com/ips-v4, 안정적이지만 갱신 시 확인)
  set_real_ip_from 173.245.48.0/20;
  set_real_ip_from 103.21.244.0/22;
  set_real_ip_from 103.22.200.0/22;
  set_real_ip_from 103.31.4.0/22;
  set_real_ip_from 141.101.64.0/18;
  set_real_ip_from 108.162.192.0/18;
  set_real_ip_from 190.93.240.0/20;
  set_real_ip_from 188.114.96.0/20;
  set_real_ip_from 197.234.240.0/22;
  set_real_ip_from 198.41.128.0/17;
  set_real_ip_from 162.158.0.0/15;
  set_real_ip_from 104.16.0.0/13;
  set_real_ip_from 104.24.0.0/14;
  set_real_ip_from 172.64.0.0/13;
  set_real_ip_from 131.0.72.0/22;
  real_ip_header CF-Connecting-IP;

  # 브루트포스 완화 (Q25). 관행값이고 팀이 조정 가능. Cloudflare 룰이 1차, 여기가 보조.
  limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
  limit_req_status 429;

  # gzip 은 생략 — Cloudflare 가 사용자향 Brotli 압축을 자동으로 함 (Q25).

  upstream backend {
    server back:8080;
    keepalive 16;
  }

  include /etc/nginx/conf.d/*.conf;
}
