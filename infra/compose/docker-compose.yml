# EC2 /opt/team1-app 에 배치. CD 가 .env 의 IMAGE_TAG 를 갱신하고 `docker compose up -d`.
name: gommit

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certs:/etc/nginx/certs:ro   # origin.pem / origin.key (Cloudflare Origin CA)
    depends_on:
      back:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 64M

  back:
    image: ghcr.io/${GHCR_REPO}/back:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      JAVA_OPTS: "-Xms256m -Xmx768m -XX:+ExitOnOutOfMemoryError -Duser.timezone=Asia/Seoul"
      SPRING_PROFILES_ACTIVE: prod
    volumes:
      - media-tmp:/app/media-tmp      # ffmpeg 임시파일
    depends_on:
      mysql:
        condition: service_healthy
    # 1800M = 인스턴스 4GB(t3a.medium) 전환분 반영. DailyLog 몽타주(feat/36, main 미병합) 완화
    # 실측 최악 1,264~1,327M(6×8회차+갤러리12명 동시)에 안전율(측정환경=Docker Desktop VM, 실 EC2 Linux 오차 보정).
    deploy:
      resources:
        limits:
          memory: 1800M
    # 이미지 Dockerfile 의 HEALTHCHECK 와 값을 맞춘다 (드리프트 방지).
    # retries 5 = start_period 후 ~150s 여유 — 아침 콜드스타트(2분+)에 --wait 가
    # 조기에 unhealthy 로 판정하지 않도록.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 90s

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command:
      # 버퍼풀 256M + 스레드 버퍼(50 conn) + InnoDB 오버헤드가 메모리 한도(600M) 안에 들어오도록.
      - --innodb-buffer-pool-size=256M
      - --max-connections=50
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    deploy:
      resources:
        limits:
          memory: 600M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # --- 모니터링 — Prometheus/Loki 는 ports: 없음, 도커 내부망 전용 ---

  prometheus:
    image: prom/prometheus:v3.0.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d   # 루트 30GB 공유, 보수적으로 7일
      - --web.listen-address=0.0.0.0:9090
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      back:
        condition: service_healthy
    # 예측 200~400M (aws-usage-summary.md) + 여유. back(1800)+mysql(600)+nginx(64) 기존 합계
    # 위에 이 4개 컨테이너 예측 합 ~1,064M 을 더해도 4GB 대비 헤드룸 안에 들어온다.
    deploy:
      resources:
        limits:
          memory: 450M

  loki:
    image: grafana/loki:3.3.2
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./monitoring/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    deploy:
      resources:
        limits:
          memory: 350M   # 예측 150~300M + 여유

  promtail:
    image: grafana/promtail:3.3.2
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yaml
    volumes:
      - ./monitoring/promtail-config.yaml:/etc/promtail/config.yaml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    deploy:
      resources:
        limits:
          memory: 64M

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: "https://grafana.${DOMAIN:-go-mmit.site}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    deploy:
      resources:
        limits:
          memory: 200M

# 야간 mysqldump 는 호스트 cron 이 backup.sh 를 돌린다 (user-data.sh 에서 등록 - 04:20).
volumes:
  mysql-data:
  media-tmp:
  prometheus-data:
  loki-data:
  grafana-data:
