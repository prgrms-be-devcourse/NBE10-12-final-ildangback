global:
  scrape_interval: 30s       # 2 vCPU 공유 박스라 여유
  evaluation_interval: 30s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: gommit-back
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["back:8080"]
        labels:
          app: gommit-back
