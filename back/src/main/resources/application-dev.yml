spring:
  datasource:
    url: jdbc:h2:file:./data/gommit;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

auth-token:
  secret-key: dev-secret-key-for-gommit-local-only-minimum-32bytes-required

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
