spring:
  datasource:
    url: jdbc:h2:mem:gommit;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: false

  servlet:
    multipart:
      max-file-size: 12MB
      max-request-size: 15MB

media:
  storage:
    local:
      base-dir: ${java.io.tmpdir}/gommit-media-test  # feat/8 LocalStorageService 테스트 파일 저장 루트

auth-token:
  secret-key: test-secret-key-for-gommit-unit-testing-minimum-32bytes-required

cors:
  allowed-origins: http://localhost:5173
