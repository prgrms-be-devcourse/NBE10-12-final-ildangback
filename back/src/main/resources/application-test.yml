spring:
  datasource:
    url: jdbc:h2:mem:gommit;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: false

app:
  frontend-base-url: http://localhost:5173
  api-base-url: http://localhost:8080

auth-token:
  secret-key: test-secret-key-for-gommit-unit-testing-minimum-32bytes-required

cors:
  allowed-origins: http://localhost:5173

oauth:
  allowed-redirect-uris:
    - http://localhost:5173/oauth/google/callback
    - http://localhost:5173/oauth/naver/callback
  google:
    client-id: test-google
    client-secret: test-google-secret
  naver:
    client-id: test-naver
    client-secret: test-naver-secret
