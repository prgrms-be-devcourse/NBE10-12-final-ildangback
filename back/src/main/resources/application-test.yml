spring:
  datasource:
    url: jdbc:h2:mem:gommit;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: false

media:
  storage:
    local:
      base-dir: ${java.io.tmpdir}/gommit-media-test  # LocalStorageService 테스트 파일 저장 루트. OS 임시 디렉터리로 정리 부담 없음

auth-token:
  secret-key: test-secret-key-for-gommit-unit-testing-minimum-32bytes-required

cors:
  allowed-origins: http://localhost:5173
