spring:
  application:
    name: gommit

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  servlet:
    multipart:
      # 사용자 업로드(CHECKIN/ITEM). 앱단 검증(5MB)보다 높게 잡아 5~12MB 는 FILE_TOO_LARGE(413) 로 떨어진다.
      max-file-size: 12MB
      max-request-size: 15MB

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 100
        format_sql: true

  flyway:
    enabled: true

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

springdoc:
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

point: # [임시값] 기획 확정 시 조정. 없으면 PointProperties 의 @DefaultValue 로 뜬다.
  check-in-reward: 10          # 개인 인증 1건
  group-daily-all-complete: 5  # 그룹 ACTIVE 전원이 그날 목표 달성

auth-token:
  access-token:
    expiration: 15m
  refresh-token:
    expiration: 30d
    reuse-grace-period: 30s

app:
  time-zone: Asia/Seoul # 인증 businessDate('오늘') 판정에 쓰는 Clock 빈의 기준 타임존
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  api-base-url: ${API_BASE_URL:http://localhost:8080}

media:
  storage:
    provider: ${MEDIA_STORAGE_PROVIDER:local}   # local | cloudinary
    local:
      base-dir: ${MEDIA_LOCAL_BASE_DIR:./data/media}
      base-url: ${MEDIA_LOCAL_BASE_URL:http://localhost:8080/media}   # PUBLIC 정적 서빙 접두사.
    cloudinary:                                 # provider=cloudinary 일 때만 사용
      cloud-name: ${CLOUDINARY_CLOUD_NAME:}
      api-key: ${CLOUDINARY_API_KEY:}
      api-secret: ${CLOUDINARY_API_SECRET:}
      root-folder: ${MEDIA_CLOUDINARY_ROOT_FOLDER:test-go-mmit}   # 계정 안 최상위 폴더. prod 는 go-mmit 로 오버라이드
    policies:
      CHECKIN:  { folder: check-ins,       max-size: 5MB,  visibility: PRIVATE, allowed-content-types: [image/png, image/jpeg, image/webp] }
      DAILYLOG: { folder: daily-check-ins, max-size: 40MB, visibility: PRIVATE, allowed-content-types: [video/mp4] }
      ITEM:     { folder: character-store, max-size: 5MB,  visibility: PUBLIC,  allowed-content-types: [image/png, image/jpeg, image/webp] }
