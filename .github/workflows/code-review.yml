name: AI PR CodeReview
on:
  pull_request:
    branches: [ "main", "dev" ]
    types: [opened, synchronize, reopened, ready_for_review] # Draft에서 Ready로 변경될 때도 트리거

jobs:
  review:
    # Draft PR이면 Job 자체를 스킵 (옵션 1)
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write # PR 코멘트는 GitHub API상 이슈 코멘트 엔드포인트를 쓴다
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-node@v4
      # 단일 패키지만 설치하므로 시간 단축을 위해 캐싱(actions/cache)은 의도적으로 생략함
      # @google/generative-ai 는 2025-08-31 EOL. 통합 SDK로 이전했다.
      - run: npm install @google/genai

      - name: Get Filtered Diff
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }}
          # 패키지 매니저 Lock 파일, 빌드 산출물, 이미지 등은 리뷰에서 제외 (옵션 2)
          # back/ 하위의 Gradle 관련 파일은 실제 경로(back/*) 기준으로 제외해야 매칭됨
          git diff origin/${{ github.event.pull_request.base.ref }}...HEAD -- . \
            ':(exclude)*.lock' \
            ':(exclude)package-lock.json' \
            ':(exclude)pnpm-lock.yaml' \
            ':(exclude)*.svg' \
            ':(exclude,glob)**/*.gradle' \
            ':(exclude)back/gradle/**' \
            ':(exclude)back/gradlew' \
            ':(exclude)back/gradlew.bat' \
            ':(exclude)back/.gradle/**' \
            ':(exclude,glob)**/build/**' \
            > diff.txt

      - name: Run Advanced Review
        uses: actions/github-script@v7
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }} # 안전한 주입
        with:
          script: |
            const fs = require("fs");
            const diff_output = fs.readFileSync("diff.txt", "utf8").trim();

            // 변경 사항이 없으면 스킵
            if (!diff_output) {
              console.log("No relevant changes to review.");
              return;
            }

            const { GoogleGenAI } = require("@google/genai");
            const ai = new GoogleGenAI({ apiKey: process.env.GEMINI_API_KEY });

            const MODEL = "gemini-3.5-flash";
            const CONFIG = { responseMimeType: "application/json" };

            // PR 의도 파악을 위한 제목 및 본문 컨텍스트 (옵션 3)
            const prTitle = context.payload.pull_request.title || "No Title";
            const prBody = context.payload.pull_request.body || "No Body";

            // 구조 단순화를 위해 프롬프트를 외부 파일로 분리하지 않고 인라인으로 유지함
            // 옵션 5, 6을 위한 복합 프롬프트
            const prompt = `
            당신은 시니어 소프트웨어 엔지니어입니다. 주어진 PR 정보와 Git Diff를 바탕으로 꼼꼼한 코드 리뷰를 진행하세요.
            반드시 아래에 명시된 JSON 스키마 구조로만 반환해야 합니다. 마크다운이나 다른 설명은 절대 추가하지 마세요.
            summary_report 필드에는 제목(예: "# 리뷰 요약" 같은 헤더)을 포함하지 마세요. 본문 내용만 작성하세요.

            인라인 코멘트(text)를 작성할 때는 반드시 내용 맨 앞에 문제의 심각도를 나타내는 Pn 룰을 달아주세요. 형식은 반드시 "P1: ", "P2: ", "P3: " 로 시작해야 합니다.
            - P1: 꼭 (버그, 보안 취약점 등 반드시 수정해야 하는 필수 사항)
            - P2: 애매 (더 나은 설계나 성능 제안 등 적극 권장하되 논의가 가능한 사항)
            - P3: 참고의견 (네이밍 컨벤션, 사소한 팁 등 무시해도 괜찮은 가벼운 제안)
            인라인 코멘트는 반드시 개선이 필요한 사항만 작성하세요. 칭찬이나 "잘 작성되었습니다" 같은 긍정적 평가는 인라인 코멘트로 달지 마세요.

            [이 프로젝트의 계층 규약]
            DTO는 도메인 패키지가 소유한다(domain/{도메인}/dto/request, /response).
            Controller는 Request DTO를 그대로 Service에 넘기고, Service는 Response DTO를 반환한다.
            따라서 Service가 Request/Response DTO를 참조하는 것은 정상이며 지적하지 마세요.
            별도의 Command/Result 계층을 두지 않으므로 그 부재를 지적하지 마세요.

            [레이어 침범 체크]
            아래는 이 프로젝트에서 반드시 잡아야 하는 최소 항목이며, 리뷰 범위의 전부가 아닙니다.
            목록에 없더라도 문제가 있으면 동일한 기준으로 지적하세요. 특히 아래 영역을 함께 살피세요.
            버그와 예외 처리 누락 / 보안 취약점 / N+1 쿼리와 불필요한 조회 /
            트랜잭션 경계와 읽기 전용 여부 / 동시성과 경쟁 상태 / 인덱스를 타지 못하는 조회 /
            null 처리 / 테스트 누락 / 네이밍과 가독성.
            지적할 때는 괄호 안의 근거를 함께 인용하세요.

            (P1)
            - Controller에서 Repository를 직접 주입하거나 호출하는 경우
            - Controller에서 Entity를 @RequestBody로 직접 받는 경우
              (클라이언트가 id, role 등 서버가 정해야 할 필드를 밀어 넣을 수 있음)
            - Controller에서 Entity를 그대로 응답으로 반환하는 경우
              (password, deletedAt 등 노출되면 안 되는 필드가 새어나감)
            - Service에서 Entity를 Controller로 반환하는 경우
              (이 프로젝트는 spring.jpa.open-in-view=false 이므로 Controller 시점에는
               영속성 컨텍스트가 닫혀 있어 지연 로딩이 LazyInitializationException으로 실패함.
               Service가 트랜잭션 안에서 Response DTO로 변환해 반환해야 함)
            - Request DTO를 응답 본문으로 재사용하는 경우
              (요청 전용 필드가 응답으로 나감)

            (P2)
            - Controller나 Service에서 ErrorCode 없이 예외를 던지는 경우
              (IllegalArgumentException, RuntimeException 등 대신 BusinessException + ErrorCode 사용.
               GlobalExceptionHandler가 잡아 일관된 ErrorResponse로 변환함.
               단, private 헬퍼의 내부 방어 코드는 예외로 둔다)
            - 성공 응답을 별도 래퍼 객체로 감싸는 경우
              (RsData 같은 공통 래퍼는 제거된 구조다. DTO를 ResponseEntity로 그대로 반환해야 함.
               목록 응답의 SliceResponse는 래퍼가 아니라 표준이므로 지적하지 않는다)
            - 하나의 DTO가 요청과 응답 양쪽에 쓰이는 경우
            - @Transactional이 Controller에 붙은 경우
            - 목록 API가 SliceResponse를 쓰지 않는 경우
              (Page·Slice를 직접 반환하거나, meta 중첩 같은 자체 응답 형식을 만드는 것 모두 해당.
               offset이든 커서든 껍데기는 SliceResponse 하나로 통일한다.
               Page·Slice 직접 반환은 Spring Boot 3.3부터 직렬화 구조가 안정 API로 보장되지 않음)
            - 커서 페이징에서 size 파라미터에 상한(@Max)이나 하한(@Min(1))이 없는 경우
              (spring.data.web.pageable.max-page-size는 Pageable에만 적용되므로
               커서 방식은 직접 막아야 한다. 상한은 서버 부하 방지,
               하한은 SliceResponse.ofCursor의 size+1 계산이 성립하기 위한 전제다.
               컨트롤러 클래스에 @Validated도 필요 — 없으면 제약이 아예 동작하지 않는다)
            - 현재 시각을 LocalDateTime.now() 외의 소스(DB 함수 등)에서 가져오는 경우
              (하루 경계가 04:00이라 시각 소스가 갈리면 논리적 날짜가 어긋남)

            (P3)
            - Entity에 @Setter가 붙은 경우
            - ErrorCode 상수 이름이 "주체_상태" 순서가 아닌 경우
              (USER_NOT_FOUND는 맞고 NOT_FOUND_USER는 틀림)

            [PR Context]
            Title: ${prTitle}
            Description: ${prBody}

            [Git Diff]
            ${diff_output}

            [응답해야 할 JSON 구조]
            {
              "summary_report": "PR 변경사항에 대한 아키텍처, 성능, 보안 측면의 전체적인 요약 및 조언 (마크다운 형식)",
              "inline_comments": [
                {
                  "path": "파일경로",
                  "line": 해당 라인 숫자,
                  "text": "P1: 개선 제안 내용"
                }
              ]
            }`;

            // API 호출 (503 과부하 / 429 rate limit 등 일시적 오류 대비 최대 3회 재시도)
            // SDK 버전에 따라 상태 코드가 실리는 필드가 달라질 수 있어 메시지 기반 폴백을 함께 본다.
            function isRetryable(e) {
              const status = e?.status ?? e?.code ?? e?.response?.status;
              if (status === 503 || status === 429) return true;
              return /\b(429|503|RESOURCE_EXHAUSTED|UNAVAILABLE)\b/.test(String(e?.message ?? ''));
            }

            async function generateWithRetry(prompt, retries = 3) {
              for (let i = 0; i < retries; i++) {
                try {
                  return await ai.models.generateContent({
                    model: MODEL,
                    contents: prompt,
                    config: CONFIG,
                  });
                } catch (e) {
                  if (isRetryable(e) && i < retries - 1) {
                    const waitMs = (i + 1) * 10000;
                    console.log(`Gemini 일시 오류, ${waitMs / 1000}s 후 재시도... (${i + 1}/${retries})`);
                    await new Promise(r => setTimeout(r, waitMs));
                  } else {
                    throw e;
                  }
                }
              }
            }
            // PR 코멘트 1개만 유지: 기존 봇 댓글을 찾아 덮어쓰고, 없으면 새로 생성 (댓글 도배 방지)
            const COMMENT_MARKER = "## 🤖 Gemini AI 코드 리뷰";
            async function upsertReviewComment(bodyText) {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
              });
              const botComment = comments.find(c => c.user.type === 'Bot' && c.body.includes(COMMENT_MARKER));

              if (botComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: botComment.id,
                  body: bodyText
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.payload.pull_request.number,
                  body: bodyText
                });
              }
            }

            // Gemini 호출 자체가 실패한 경우 (재시도 소진 등) - 침묵하지 않고 실패를 댓글로 알림
            let result;
            try {
              result = await generateWithRetry(prompt);
            } catch (e) {
              console.error("Gemini API call failed:", e);
              await upsertReviewComment(
                `${COMMENT_MARKER}\n\n⚠️ 리뷰 생성에 실패했습니다 (API 오류: ${e.status || e.message}).\n` +
                `이 댓글은 이전 커밋 기준일 수 있으니 참고용으로만 사용하고, Actions 로그를 확인해주세요.`
              );
              return;
            }
            // 통합 SDK는 text 가 메서드가 아니라 프로퍼티다.
            const responseText = result.text;

            // 응답 JSON 파싱 실패 시에도 침묵하지 않고 실패를 댓글로 알림
            let reviewData;
            try {
              reviewData = JSON.parse(responseText);
            } catch (e) {
              console.error("JSON Parse Error. Raw response:", responseText);
              await upsertReviewComment(
                `${COMMENT_MARKER}\n\n⚠️ 리뷰 응답을 해석하지 못했습니다 (JSON 파싱 오류).\n` +
                `이 댓글은 이전 커밋 기준일 수 있으니 참고용으로만 사용하고, Actions 로그를 확인해주세요.`
              );
              return;
            }

            const { summary_report, inline_comments } = reviewData;

            // diff에 실제로 존재하는 라인만 추출 (GitHub API는 diff 외부 라인을 거부함)
            function buildValidLineMap(diffText) {
              const validLines = {};
              let currentFile = null;
              let newLineNum = 0;
              for (const line of diffText.split('\n')) {
                const fileMatch = line.match(/^\+\+\+ b\/(.+)$/);
                if (fileMatch) {
                  currentFile = fileMatch[1];
                  if (!validLines[currentFile]) validLines[currentFile] = new Set();
                  continue;
                }
                const hunkMatch = line.match(/^@@ -\d+(?:,\d+)? \+(\d+)(?:,\d+)? @@/);
                if (hunkMatch) {
                  newLineNum = parseInt(hunkMatch[1]);
                  continue;
                }
                if (!currentFile) continue;
                if (line.startsWith('+') && !line.startsWith('+++')) {
                  // 추가된 라인: RIGHT side 기준 유효
                  validLines[currentFile].add(newLineNum++);
                } else if (line.startsWith('-') && !line.startsWith('---')) {
                  // 삭제된 라인: 새 파일에 존재하지 않으므로 번호 증가 없음
                } else if (line.startsWith(' ')) {
                  // 컨텍스트 라인: 공백으로 시작, RIGHT side 기준 유효
                  validLines[currentFile].add(newLineNum++);
                }
              }
              return validLines;
            }
            const validLineMap = buildValidLineMap(diff_output);

            // diff에 실제로 존재하는 라인 + text가 실제 문자열인 이슈만 남기고, 요약 댓글의 테이블로 통합
            const validComments = (inline_comments || []).filter(c => {
              if (typeof c.text !== 'string') {
                console.log(`Skip comment with invalid text: ${c.path}:${c.line}`);
                return false;
              }
              const validSet = validLineMap[c.path];
              const isValid = validSet && validSet.has(Number(c.line));
              if (!isValid) console.log(`Skip invalid line: ${c.path}:${c.line}`);
              return isValid;
            });

            const severityOrder = { P1: 0, P2: 1, P3: 2 };
            validComments.sort((a, b) => {
              const sa = (a.text.match(/^P([1-3]):/) || [])[1];
              const sb = (b.text.match(/^P([1-3]):/) || [])[1];
              return (severityOrder[`P${sa}`] ?? 99) - (severityOrder[`P${sb}`] ?? 99);
            });

            let issuesTable = '';
            if (validComments.length > 0) {
              issuesTable = `\n### 🔍 발견된 이슈\n| 파일 | 라인 | 심각도 | 내용 |\n|------|------|------|------|\n`;
              validComments.forEach(c => {
                const match = c.text.match(/^P([1-3]):\s*([\s\S]*)$/);
                const severity = match ? `P${match[1]}` : '-';
                const content = (match ? match[2] : c.text).replace(/\|/g, '\\|').replace(/\n/g, ' ');
                issuesTable += `| \`${c.path}\` | ${c.line} | ${severity} | ${content} |\n`;
              });
            }

            const cleanReport = (summary_report || '요약을 생성하지 못했습니다.').replace(/^#+\s*.+\n+/, '').trim();
            const bodyText = `${COMMENT_MARKER}\n\n${cleanReport}\n${issuesTable}`;

            await upsertReviewComment(bodyText);
            console.log("Advanced Review Process Completed.");
