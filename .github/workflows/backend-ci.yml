name: Backend CI

on:
  push:
    branches: [ "main", "dev" ]
    paths:
      - 'back/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ "main", "dev" ]
    paths:
      - 'back/**'
      - '.github/workflows/backend-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      issues: write

    defaults:
      run:
        working-directory: ./back

    steps:
      - uses: actions/checkout@v4
        with:
          # base 와의 merge-base 가 있어야 "이 PR 이 바꾼 파일" 을 계산할 수 있다
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          build-root-directory: ./back

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # Checkstyle 은 back/src 전체를 검사한다. 이 PR 이 건드리지 않은 파일의 위반까지
      # 코멘트 표에 실리면 아무도 표를 읽지 않게 되므로, 바뀐 파일 목록을 뽑아 필터로 쓴다.
      # git diff --name-only 는 저장소 루트 기준 경로를 뱉는다 (back/src/... 형태).
      - name: Collect changed files
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          git diff --name-only "origin/$BASE_REF...HEAD" > "$GITHUB_WORKSPACE/changed-files.txt"
          echo "변경 파일 $(wc -l < "$GITHUB_WORKSPACE/changed-files.txt")건"

      - name: Run Tests with Coverage
        run: ./gradlew check
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}

      - name: Check Formatting
        id: spotless
        if: always()
        continue-on-error: true
        run: ./gradlew spotlessCheck

      - name: Publish Test Report
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: 'back/build/test-results/test/*.xml'
          check_name: 'Test Results'
          detailed_summary: true
          include_passed: false

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: back/build/reports/jacoco/test/html/

      - name: Generate Lint Summary
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          SPOTLESS_OUTCOME: ${{ steps.spotless.outcome }}
        with:
          script: |
            const fs = require('fs');

            const MARKER = '## 🧹 코드 스타일 리포트';
            const ws = process.env.GITHUB_WORKSPACE + '/';

            // 이 PR 이 바꾼 파일 (저장소 루트 기준 경로). 없으면 필터를 걸지 않는다.
            const changedFile = ws + 'changed-files.txt';
            const changed = fs.existsSync(changedFile)
              ? new Set(
                  fs.readFileSync(changedFile, 'utf-8').split('\n').map(s => s.trim()).filter(Boolean)
                )
              : null;

            const toRepoPath = (abs) => (abs.startsWith(ws) ? abs.slice(ws.length) : abs);
            const toShort = (p) => p.replace(/^back\/src\/(main|test)\/java\//, '');
            const isMine = (repoPath) => !changed || changed.has(repoPath);

            // Checkstyle XML 파싱. 위반이 없으면 <file> 안에 <error>가 없다.
            const readViolations = (file) => {
              if (!fs.existsSync(file)) return [];
              const xml = fs.readFileSync(file, 'utf-8');
              const out = [];
              const fileRe = /<file name="([^"]+)">([\s\S]*?)<\/file>/g;
              let fm;
              while ((fm = fileRe.exec(xml)) !== null) {
                const repoPath = toRepoPath(fm[1]);
                const errRe = /<error line="(\d+)"[^>]*severity="([^"]*)"[^>]*message="([^"]*)"/g;
                let em;
                while ((em = errRe.exec(fm[2])) !== null) {
                  out.push({
                    path: repoPath,
                    file: toShort(repoPath),
                    line: em[1],
                    severity: em[2],
                    message: em[3]
                      .replace(/&quot;/g, '"')
                      .replace(/&apos;/g, "'")
                      .replace(/&lt;/g, '<')
                      .replace(/&gt;/g, '>')
                      .replace(/&amp;/g, '&')
                      .replace(/\|/g, '\\|'),
                  });
                }
              }
              return out;
            };

            const allViolations = [
              ...readViolations('./back/build/reports/checkstyle/main.xml'),
              ...readViolations('./back/build/reports/checkstyle/test.xml'),
            ];
            const myViolations = allViolations.filter(v => isMine(v.path));

            // outcome 은 success, failure, skipped, cancelled 넷이다.
            // skipped 를 통과로 읽으면 검사하지 않은 것을 "통과" 라고 보고하게 된다.
            const formatOutcome = process.env.SPOTLESS_OUTCOME;
            const formatFailed = formatOutcome === 'failure';
            const formatRan = formatOutcome === 'success' || formatFailed;

            const sha = context.payload.pull_request.head.sha;
            const commit = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: sha,
            });
            const subject = commit.data.commit.message.split('\n')[0];
            const repoPath = `${context.repo.owner}/${context.repo.repo}`;

            let body = `${MARKER}\n`;
            body += `📌 **기준 커밋**: [\`${sha.substring(0, 7)}\`](https://github.com/${repoPath}/commit/${sha}) - ${subject}\n\n`;

            if (changed) {
              body += `아래 표는 **이 PR 이 바꾼 파일**만 담았습니다. 괄호 안이 저장소 전체 수치입니다.\n\n`;
            }

            // 포맷
            if (!formatRan) {
              body += `❔ 포맷 검사를 실행하지 못했습니다 (스텝 ${formatOutcome}).\n\n`;
            } else if (formatFailed) {
              body += `⚠️ **포맷 위반이 있습니다.** \`./gradlew spotlessApply\` 실행 후 커밋해주세요.\n\n`;
            } else {
              body += `✅ 포맷 통과\n\n`;
            }

            // Checkstyle
            if (myViolations.length === 0) {
              const scope = allViolations.length > 0 ? ` (전체 ${allViolations.length}건)` : '';
              body += `✅ Checkstyle 통과${scope}\n`;
            } else {
              body += `### Checkstyle 위반 ${myViolations.length}건 (전체 ${allViolations.length}건)\n`;
              body += `| 파일 | 라인 | 내용 |\n|------|------|------|\n`;
              myViolations.slice(0, 20).forEach(v => {
                body += `| \`${v.file}\` | ${v.line} | ${v.message} |\n`;
              });
              if (myViolations.length > 20) {
                body += `\n_외 ${myViolations.length - 20}건_\n`;
              }
            }

            body += `\n> 이 리포트는 경고입니다. 머지를 막지 않습니다.`;

            const comments = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const existing = comments.data.find(
              c => c.user.type === 'Bot' && c.body.includes(MARKER)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                comment_id: existing.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }

      - name: Generate Jacoco Report Summary
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            // HTML 이 아니라 XML 을 읽는다. build.gradle 에서 xml.required = true 로 항상 생성된다.
            //
            // HTML 의 막대 셀은 "14 of 130" 처럼 나오는데 이게 "커버 14 / 전체 130" 이 아니라
            // "빠뜨린 14 / 전체 130" 이다. 앞자리를 커버로 읽으면 옆 칸의 89% 와 어긋난 표가 나온다.
            // XML 은 <counter type="BRANCH" missed="14" covered="116"/> 처럼 이름표가 붙어 있어
            // 뒤집힐 여지가 없고, 컬럼 순서를 세지 않아도 되고, n/a 나 self-closing 셀 예외도 없다.
            const XML = './back/build/reports/jacoco/test/jacocoTestReport.xml';
            if (!fs.existsSync(XML)) {
              console.log('Jacoco XML not found');
              return;
            }

            const attr = (s, key) => (new RegExp(key + '="([^"]*)"').exec(s) || [])[1];

            // 자식 요소(class, sourcefile)의 counter 가 먼저 나오고 자기 자신의 집계가 마지막에 나온다.
            // 같은 type 을 덮어쓰면 마지막 값, 즉 그 요소의 집계가 남는다.
            const countersOf = (chunk) => {
              const out = {};
              for (const m of chunk.matchAll(/<counter\b([^>]*?)\/>/g)) {
                const type = attr(m[1], 'type');
                if (!type) continue;
                out[type] = { missed: Number(attr(m[1], 'missed')), covered: Number(attr(m[1], 'covered')) };
              }
              return out;
            };

            // jacoco HTML 은 퍼센트를 내림한다. 리포트와 코멘트가 다른 숫자를 보이지 않도록 맞춘다.
            const pct = (c) => {
              if (!c) return null;
              const total = c.missed + c.covered;
              return total === 0 ? null : Math.floor((c.covered / total) * 100);
            };

            const parse = (xml) => {
              const packages = new Map();
              for (const m of xml.matchAll(/<package\b([^>]*)>([\s\S]*?)<\/package>/g)) {
                const name = (attr(m[1], 'name') || '').replace(/\//g, '.');
                packages.set(name, countersOf(m[2]));
              }
              // report 자신의 counter 는 마지막 </package> 뒤에 온다.
              const cut = xml.lastIndexOf('</package>');
              return { total: countersOf(cut === -1 ? xml : xml.slice(cut)), packages };
            };

            const current = parse(fs.readFileSync(XML, 'utf-8'));

            const commitSha = context.payload.pull_request.head.sha;
            const commit = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: commitSha,
            });
            const commitMessage = commit.data.commit.message.split('\n')[0];
            const repoPath = `${context.repo.owner}/${context.repo.repo}`;

            // 전체 현황
            const metrics = [
              { key: 'LINE', label: '라인', goal: 80 },
              { key: 'BRANCH', label: '브랜치', goal: 70 },
            ];

            let overallReport = `### 전체 커버리지 현황\n`;
            overallReport += `| 메트릭 | 커버리지 | 커버 / 전체 | 상태 | 목표 |\n|---|---|---|---|---|\n`;

            metrics.forEach(({ key, label, goal }) => {
              const c = current.total[key];
              const value = pct(c);
              if (value === null) {
                overallReport += `| **${label}** | n/a | 0 / 0 | - | ${goal}% |\n`;
                return;
              }
              const status = value >= goal ? '✅' : '⚠️';
              overallReport += `| **${label}** | ${value}% | ${c.covered} / ${c.missed + c.covered} | ${status} | ${goal}% |\n`;
            });

            // 패키지별
            const shortName = (n) => n.replace(/^com\.gommit\.domain\./, '');
            const rows = [...current.packages.entries()]
              .map(([name, counters]) => ({
                name: shortName(name),
                line: pct(counters.LINE),
                lineCounts: counters.LINE,
                branch: pct(counters.BRANCH),
                branchCounts: counters.BRANCH,
              }))
              .sort((a, b) => (b.line ?? -1) - (a.line ?? -1));

            let packageReport = '';
            if (rows.length > 0) {
              packageReport = `### 패키지별 커버리지\n| 패키지 | 라인 | 브랜치 |\n|---|---|---|\n`;
              rows.forEach(r => {
                const lineStatus = r.line >= 80 ? '✅' : r.line >= 70 ? '⚠️' : '❌';
                const counts = r.lineCounts ? ` (${r.lineCounts.covered}/${r.lineCounts.covered + r.lineCounts.missed})` : '';
                const lineCell = r.line === null ? 'n/a' : `${r.line}% ${lineStatus}${counts}`;

                // 분기가 0개인 패키지는 counter 자체가 없다. 0% 가 아니라 "셀 게 없다" 는 뜻이다.
                let branchCell = 'n/a';
                if (r.branch !== null) {
                  const branchStatus = r.branch >= 70 ? '✅' : r.branch >= 60 ? '⚠️' : '❌';
                  branchCell = `${r.branch}% ${branchStatus} (${r.branchCounts.covered}/${r.branchCounts.covered + r.branchCounts.missed})`;
                }

                packageReport += `| ${r.name} | ${lineCell} | ${branchCell} |\n`;
              });
            }

            let header = `## 📊 Jacoco 커버리지 리포트\n`;
            header += `📌 **기준 커밋**: [\`${commitSha.substring(0, 7)}\`](https://github.com/${repoPath}/commit/${commitSha}) - ${commitMessage}\n`;

            const comment = `${header}\n${overallReport}\n${packageReport}\n💬 [상세 리포트 보기](https://github.com/${repoPath}/actions/runs/${context.runId})`;

            const comments = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo
            });

            const existingComment = comments.data.find(
              c => c.user.type === 'Bot' && c.body.includes('📊 Jacoco 커버리지 리포트')
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                comment_id: existingComment.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }
