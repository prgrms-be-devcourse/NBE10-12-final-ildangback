name: Discord Notify

on:
  workflow_run:
    workflows: ["Backend CI", "Frontend CI", "AI PR CodeReview"]
    types: [completed]
  pull_request:
    types: [closed]

env:
  DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

jobs:
  ci-result:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      # head_sha별로 직렬화. cancel-in-progress를 켜면 curl 발송 후 마커 등록 전에
      # 취소될 때 중복 발송이 생길 수 있어 끄고 큐잉한다.
      group: discord-notify-${{ github.event.workflow_run.head_sha }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read       # 커밋/상태 조회
      pull-requests: read  # PR 조회 (draft 여부, 제목)
      statuses: write      # 발송 완료 커밋 상태(마커 겸 재알림 판정 기준)
    steps:
      # watchWorkflows/judgeWorkflows는 각 CI yml의 `name:` 문자열과 일치해야 한다.
      - name: 관련 CI 전체 완료 여부 확인
        id: check
        uses: actions/github-script@v7
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_USER_MAP: ${{ secrets.DISCORD_USER_MAP }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const headSha = context.payload.workflow_run.head_sha;

            // 웹훅 미설정이면 이후 curl 스텝이 전부 실패하므로 여기서 걸러 전체를 스킵.
            if (!process.env.DISCORD_WEBHOOK) {
              core.warning("DISCORD_WEBHOOK 시크릿이 없어 Discord 알림을 건너뜁니다.");
              core.setOutput("ready", "false");
              return;
            }

            // workflow_run.pull_requests[]는 비어 올 수 있다(fork/타이밍). 비면 커밋으로 PR 조회.
            // PR을 못 얻으면 draft 스킵과 성공 알림 재알림 방지 판정이 동작하지 않는다.
            let prNumber = context.payload.workflow_run.pull_requests?.[0]?.number;
            if (!prNumber) {
              const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner, repo, commit_sha: headSha,
              });
              prNumber = prs.find(p => p.state === "open")?.number ?? prs[0]?.number;
            }

            // 중복 발송 방지: watchWorkflows가 각각 완료될 때마다 이 워크플로가 다시 트리거된다.
            // head_sha의 커밋 상태 "discord-notify"를 영속 마커로 삼아, 있으면 무조건 스킵한다.
            // (draft 조회보다 먼저 둬서 재트리거 job의 불필요한 API 호출을 아낀다)
            const { data: combined } = await github.rest.repos.getCombinedStatusForRef({ owner, repo, ref: headSha });
            if (combined.statuses.some(s => s.context === "discord-notify")) {
              core.info("이 커밋에 이미 알림을 보냈습니다. 건너뜁니다.");
              core.setOutput("ready", "false");
              return;
            }

            // Draft PR은 알림하지 않는다(페이로드에 draft 필드가 없어 API로 조회). pr 객체는
            // 아래 재알림 판정/제목에도 재사용한다. 번호를 못 얻으면 draft 판단 불가 -> 그냥 진행.
            let pr = null;
            if (prNumber) {
              ({ data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber }));
              if (pr.draft) {
                core.info("Draft PR이라 건너뜁니다.");
                core.setOutput("ready", "false");
                return;
              }
            }

            const watchWorkflows = ["Backend CI", "Frontend CI", "AI PR CodeReview"];
            const judgeWorkflows = ["Backend CI", "Frontend CI"];

            const fetchLatestRuns = async () => {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                owner, repo, head_sha: headSha, event: "pull_request", per_page: 50,
              });
              const byName = {};
              for (const run of data.workflow_runs) {
                if (!watchWorkflows.includes(run.name)) continue;
                if (!byName[run.name] || run.id > byName[run.name].id) byName[run.name] = run;
              }
              return byName;
            };

            // 같은 push로 만들어진 run들은 목록에 함께 나타난다. 트리거한 워크플로의 run이
            // 보이면 리스트가 최신이라 보고, 안 보이는 watchWorkflow는 필터로 안 돈 것으로
            // 취급한다(아래 judgeRan). 트리거한 run조차 안 보이면 API 인덱싱 지연 -> 1회 재조회.
            const triggerName = context.payload.workflow_run.name;
            let latestByName = await fetchLatestRuns();
            if (!latestByName[triggerName]) {
              await new Promise(r => setTimeout(r, 5000));
              latestByName = await fetchLatestRuns();
            }

            const runs = Object.values(latestByName);
            const incomplete = runs.filter(r => r.status !== "completed");
            if (incomplete.length > 0) {
              core.info(`아직 실행 중: ${incomplete.map(r => r.name).join(", ")}`);
              core.setOutput("ready", "false");
              return;
            }

            // skipped(필터로 건너뜀)는 실패가 아니다. judgeRuns가 비면(경로 변경 없음)
            // allSuccess=true가 되어 "CI 해당X" 성공 알림으로 이어진다.
            const isPass = c => c === "success" || c === "skipped";
            const judgeRuns = runs.filter(r => judgeWorkflows.includes(r.name));
            const judgeRan = judgeRuns.length > 0;
            const failedRuns = judgeRuns.filter(r => !isPass(r.conclusion));
            const allSuccess = failedRuns.length === 0;

            // 리뷰 중 커밋을 추가해 CI가 계속 통과해도 성공 알림(리뷰어 핑)은 PR당 한 번만.
            // 판정 기준은 부모 커밋의 discord-notify 상태 — success면 이미 보낸 것이므로 건너뛴다.
            // (라벨 대신 커밋 상태를 재사용 → PR엔 아무것도 안 붙는다. 실패 알림은 항상 보낸다.)
            // 부모가 failure면 직전 커밋에서 CI가 깨졌다 복구된 것이므로 그대로 성공 알림을 보낸다.
            if (allSuccess && pr) {
              const { data: headCommit } = await github.rest.repos.getCommit({ owner, repo, ref: headSha });
              const parentSha = headCommit.parents[0]?.sha;
              if (parentSha) {
                const { data: parentStatus } = await github.rest.repos.getCombinedStatusForRef({ owner, repo, ref: parentSha });
                const marker = parentStatus.statuses.find(s => s.context === "discord-notify");
                if (marker?.state === "success") {
                  core.info("직전 커밋에서 이미 성공 알림을 보낸 PR이라 건너뜁니다.");
                  core.setOutput("ready", "false");
                  return;
                }
              }
            }

            const notifyTitle = judgeRan ? "✅ PR 오픈 (CI 통과)" : "📝 PR 오픈 (CI 해당X)";
            const ciLine = judgeRan
              ? `✅ CI 통과: ${judgeRuns.map(r => r.name).join(", ")}`
              : "➖ back/front 변경 없어 CI 미실행";

            // AI 코드리뷰는 실패했을 때만 노출(판정에는 미반영).
            const cr = runs.find(r => r.name === "AI PR CodeReview");
            const codeReviewLine = cr && !isPass(cr.conclusion)
              ? `⚠️ AI 코드리뷰 실패 (판정 미반영) — ${cr.html_url}`
              : "";

            // 실패 알림 멘션: actor.login -> DISCORD_USER_MAP[login] -> <@id>.
            // 맵이 없거나 JSON이 깨졌으면 @login으로 폴백(로그에 ⚠️ 남김).
            const login = context.payload.workflow_run.actor.login;
            let mention = `@${login}`;
            if (process.env.DISCORD_USER_MAP) {
              try {
                const id = JSON.parse(process.env.DISCORD_USER_MAP)[login];
                if (id) mention = `<@${id}>`;
              } catch {
                core.warning("DISCORD_USER_MAP JSON 파싱 실패 — 멘션 없이 진행합니다.");
              }
            }

            // 마커는 여기서 남기지 않는다 — 발송 실패/취소 시 마커만 남으면 알림이 유실된다.
            core.setOutput("ready", "true");
            core.setOutput("success", String(allSuccess));
            core.setOutput("notify_title", notifyTitle);
            core.setOutput("ci_line", ciLine);
            core.setOutput("codereview_line", codeReviewLine);
            core.setOutput("failed_workflows", failedRuns.map(r => `❌ ${r.name}: ${r.html_url}`).join("\n"));
            core.setOutput("mention", mention);
            // display_title은 PR 제목이 아닐 수 있어 pulls.get의 pr.title을 쓴다(없으면 폴백).
            core.setOutput("pr_title", pr ? pr.title : "");

      - name: 알림 발송
        id: notify
        if: steps.check.outputs.ready == 'true'
        env:
          SUCCESS: ${{ steps.check.outputs.success }}
          NOTIFY_TITLE: ${{ steps.check.outputs.notify_title }}
          PR_TITLE: ${{ steps.check.outputs.pr_title || github.event.workflow_run.display_title }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          CI_LINE: ${{ steps.check.outputs.ci_line }}
          CODEREVIEW_LINE: ${{ steps.check.outputs.codereview_line }}
          FAILED: ${{ steps.check.outputs.failed_workflows }}
          MENTION: ${{ steps.check.outputs.mention }}
        run: |
          if [ "$SUCCESS" = "true" ]; then
            jq -n \
              --arg title "$NOTIFY_TITLE" --arg pr "$PR_TITLE" --arg branch "$BRANCH" \
              --arg ci "$CI_LINE" --arg cr "$CODEREVIEW_LINE" '{
              embeds: [{
                title: $title, color: 5763719,
                fields: ([
                  { name: "🔖 PR", value: $pr, inline: false },
                  { name: "🌱 브랜치", value: ("`" + $branch + "`"), inline: true },
                  { name: "CI", value: $ci, inline: true }
                ] + (if $cr != "" then [{ name: "AI 코드리뷰", value: $cr, inline: true }] else [] end)),
                footer: { text: "👀 리뷰 부탁드립니다!" }
              }]
            }' > payload.json
          else
            jq -n \
              --arg pr "$PR_TITLE" --arg branch "$BRANCH" \
              --arg mention "${MENTION:-담당자 확인 필요}" \
              --arg failed "$FAILED" --arg cr "$CODEREVIEW_LINE" '{
              embeds: [{
                title: "🔥 CI 실패", color: 15548997,
                fields: ([
                  { name: "🔖 PR", value: $pr, inline: false },
                  { name: "🌱 브랜치", value: ("`" + $branch + "`"), inline: true },
                  { name: "⚠️ 확인 요망", value: $mention, inline: true },
                  { name: "📄 실패한 워크플로", value: $failed, inline: false }
                ] + (if $cr != "" then [{ name: "AI 코드리뷰", value: $cr, inline: false }] else [] end))
              }]
            }' > payload.json
          fi
          curl -sS -f --connect-timeout 5 --max-time 15 -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" -d @payload.json

      - name: 발송 완료 마커 등록
        # 발송이 실제로 성공했을 때만 마커를 남긴다. notify가 실패(curl 오류)하거나
        # 스킵(ready=false)이면 마커가 안 남아 다음 트리거가 재시도한다.
        if: steps.notify.outcome == 'success'
        uses: actions/github-script@v7
        env:
          ALL_SUCCESS: ${{ steps.check.outputs.success }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const allSuccess = process.env.ALL_SUCCESS === "true";

            // 이 커밋 상태가 발송 마커 겸 "직전 성공 알림 여부" 판정 기준이다(위 check 스텝).
            // PR 체크 목록에 노출되므로 실제 CI 결과를 state에 반영한다.
            await github.rest.repos.createCommitStatus({
              owner, repo, sha: context.payload.workflow_run.head_sha,
              state: allSuccess ? "success" : "failure",
              context: "discord-notify",
              description: allSuccess ? "Discord 알림 발송됨 (CI 통과)" : "Discord 알림 발송됨 (CI 실패)",
            });

  merge-notify:
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: 머지 알림
        if: env.DISCORD_WEBHOOK != ''
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          jq -n --arg pr "$PR_TITLE" --arg head "$HEAD_REF" --arg base "$BASE_REF" '{
            embeds: [{
              title: "🎉 PR 머지됨", color: 5793266,
              fields: [
                { name: "🏷️ PR", value: $pr, inline: false },
                { name: "➡️ 브랜치", value: ($head + " → " + $base), inline: false }
              ]
            }]
          }' > payload.json
          curl -sS -f --connect-timeout 5 --max-time 15 -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" -d @payload.json
