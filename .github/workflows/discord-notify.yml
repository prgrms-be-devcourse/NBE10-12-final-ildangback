name: Discord Notify

on:
  workflow_run:
    workflows: ["Backend CI", "Frontend CI", "AI PR CodeReview"]
    types: [completed]
  pull_request:
    types: [closed]

env:
  DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

jobs:
  ci-result:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: discord-notify-${{ github.event.workflow_run.head_sha }}
      cancel-in-progress: true
    permissions:
      actions: read
      # 리뷰 중간에 추가된 커밋에서는 성공 알림을 건너뛰기 위해 PR에 discord-ci-passed
      # 라벨을 붙인다. 라벨 생성/부여에 issues: write, pull-requests: write가 필요하다.
      pull-requests: write
      issues: write
      statuses: write
    steps:
      # workflow_run 트리거 대상(watchWorkflows/judgeWorkflows)은 이름 문자열로 매칭한다.
      # backend-ci.yml / frontend-ci.yml / code-review.yml 의 `name:` 을 바꾸면
      # 여기도 같이 바꿔야 한다 (안 바꾸면 알림이 조용히 안 오게 됨).
      - name: 관련 CI 전체 완료 여부 확인
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const headSha = context.payload.workflow_run.head_sha;
            const prNumber = context.payload.workflow_run.pull_requests?.[0]?.number;

            // Draft PR은 아직 리뷰받을 준비가 안 된 PR이므로 알림을 보내지 않는다.
            // workflow_run 페이로드의 pull_requests[]엔 draft 필드가 없어서 API로 직접 조회해야 한다.
            // (fork PR 등 pull_requests가 비어 있어 번호를 못 얻으면 draft 여부를 판단할 수 없음
            //  -> 이 경우엔 알림을 막지 않고 그대로 진행한다)
            // 여기서 가져온 pr 객체는 아래 "이미 성공 알림을 보낸 PR인지" 판단에도 재사용한다.
            let pr = null;
            if (prNumber) {
              const { data: fetchedPr } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
              pr = fetchedPr;
              if (pr.draft) {
                core.info("Draft PR이라 알림을 건너뜁니다.");
                core.setOutput("ready", "false");
                return;
              }
            }

            // 중복 발송 방지: 이 워크플로는 watchWorkflows(Backend/Frontend/AI 코드리뷰) 각각이
            // 완료될 때마다 별도의 workflow_run 이벤트로 다시 트리거된다. concurrency의
            // cancel-in-progress는 "동시에 겹쳐서 실행되는" job만 막아주고, 이미 끝난 job이
            // 알림을 보낸 뒤 나중에 또 다른 workflow_run이 뒤이어 완료돼 새 job이 도는 경우
            // (예: Backend/Frontend는 빨리 끝나서 먼저 알림을 보냈는데, AI 코드리뷰는 LLM 호출
            // 때문에 60초 넘게 걸려 뒤늦게 완료되며 다시 트리거되는 경우)까지는 못 막는다.
            // 그래서 head_sha에 커밋 상태(commit status)를 "발송 완료" 마커로 남겨 영속적으로
            // 확인한다. 이 마커가 이미 있으면 무조건 건너뛰어 절대 중복 발송하지 않는다.
            const notifyContext = "discord-notify";
            const { data: combinedStatus } = await github.rest.repos.getCombinedStatusForRef({ owner, repo, ref: headSha });
            if (combinedStatus.statuses.some(s => s.context === notifyContext)) {
              core.info("이미 이 커밋(SHA)에 대해 알림을 보냈습니다. 중복 발송 방지를 위해 건너뜁니다.");
              core.setOutput("ready", "false");
              return;
            }

            const watchWorkflows = ["Backend CI", "Frontend CI", "AI PR CodeReview"];
            const judgeWorkflows = ["Backend CI", "Frontend CI"];

            async function fetchLatestRuns() {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                owner, repo,
                head_sha: headSha,
                event: "pull_request",
                per_page: 50,
              });

              const latestByName = {};
              for (const run of data.workflow_runs) {
                if (!watchWorkflows.includes(run.name)) continue;
                const prev = latestByName[run.name];
                if (!prev || run.id > prev.id) latestByName[run.name] = run;
              }
              return latestByName;
            }

            // watchWorkflows 중 아직 큐잉조차 안 된 게 있으면 API 조회에 안 잡혀서
            // "완료"로 오판 -> PR 하나에 알림이 여러 번 갈 수 있음. 전부 잡힐 때까지 잠깐 대기.
            // 단, 경로 필터로 아예 트리거되지 않는 워크플로는 이 방식으로는 "아직 큐잉 안 됨"과
            // 구분이 불가능해서(트리거 안 되면 run 자체가 안 생김) 결국 maxWaitMs를 다 채우고 넘어감.
            // 완벽히 구분하려면 각 CI의 paths 필터를 여기서도 복제해야 하는데 유지보수 부담이 커서
            // 최대 대기시간을 짧게 잡아 그 경우의 지연을 줄이는 선에서 타협함.
            const maxWaitMs = 60 * 1000;
            const intervalMs = 10 * 1000;
            const waitStartedAt = Date.now();
            let latestByName = await fetchLatestRuns();
            while (
              Object.keys(latestByName).length < watchWorkflows.length &&
              Date.now() - waitStartedAt < maxWaitMs
            ) {
              core.info(`아직 시작되지 않은 워크플로 대기 중... (${Object.keys(latestByName).length}/${watchWorkflows.length})`);
              await new Promise(r => setTimeout(r, intervalMs));
              latestByName = await fetchLatestRuns();
            }

            const runs = Object.values(latestByName);

            const incomplete = runs.filter(r => r.status !== "completed");
            if (incomplete.length > 0) {
              core.info(`아직 완료되지 않은 워크플로: ${incomplete.map(r => r.name).join(", ")}`);
              core.setOutput("ready", "false");
              return;
            }

            const judgeRuns = runs.filter(r => judgeWorkflows.includes(r.name));
            const judgeRan = judgeRuns.length > 0;
            const failedRuns = judgeRuns.filter(r => r.conclusion !== "success");
            // judgeRuns가 비어있으면(judgeRan=false, 즉 backend/frontend 경로 변경이 없어
            // 해당 CI가 아예 트리거되지 않았으면) failedRuns도 빈 배열이 되어 allSuccess가
            // true가 된다. 즉 "CI 해당 없음"은 "성공"으로 취급되어 성공 알림(아래 notifyTitle의
            // "CI 해당X" 문구)으로 이어진다.
            const allSuccess = failedRuns.length === 0;

            // 리뷰 중간에 커밋을 추가해 CI가 다시 통과해도, 이미 한 번 성공 알림을 보낸
            // PR이면 또 보내지 않는다(리뷰어에게 매번 알림이 가는 걸 막기 위함).
            // 실패 알림은 이 라벨과 무관하게 항상 보낸다 — 리뷰 중 CI가 깨진 건 계속 알아야 함.
            // "보낸 적 있음" 마커는 라벨(discord-ci-passed)로 남기고, 실제로 성공 알림을
            // 보낸 시점("발송 완료 마커 등록" 스텝)에 붙인다.
            // TODO: 나중에 필요해지면, 이 경우(리뷰 중 커밋 추가로 재통과)에도 다른 제목의
            // 알림을 보내도록 확장한다.
            const CI_PASSED_LABEL = "discord-ci-passed";
            const alreadyPassedBefore = !!pr && pr.labels.some(l => l.name === CI_PASSED_LABEL);
            if (allSuccess && alreadyPassedBefore) {
              core.info("이미 성공 알림을 보낸 PR에 새 커밋이 추가된 경우라 알림을 건너뜁니다.");
              core.setOutput("ready", "false");
              return;
            }

            let notifyTitle, ciLine;
            if (!judgeRan) {
              notifyTitle = "📝 PR 오픈 (CI 해당X)";
              ciLine = "➖ back/front 변경 없어 CI 미실행";
            } else {
              notifyTitle = "✅ PR 오픈 (CI 통과)";
              ciLine = `✅ CI 통과: ${judgeRuns.map(r => r.name).join(", ")}`;
            }

            // AI 코드리뷰는 통과/스킵/미실행이면 보여줄 필요 없음. 실패했을 때만 노출.
            const codeReviewRun = runs.find(r => r.name === "AI PR CodeReview");
            let codeReviewLine = "";
            if (codeReviewRun && codeReviewRun.conclusion !== "success" && codeReviewRun.conclusion !== "skipped") {
              codeReviewLine = `⚠️ AI 코드리뷰 실패 (판정에는 미반영) — ${codeReviewRun.html_url}`;
            }

            const failedLines = failedRuns
              .map(r => `❌ ${r.name}: ${r.html_url}`)
              .join("\n");

            // "발송 완료" 마커는 여기서 바로 남기지 않는다. concurrency(cancel-in-progress)로
            // 이 job이 취소될 경우, 실제 Discord 발송 전에 마커만 찍히면 뒤이은 job이 그 마커만
            // 보고 스킵해버려 알림이 통째로 유실된다. 그래서 마커는 실제 curl 발송이 끝난 뒤
            // 마지막 스텝("발송 완료 마커 등록")에서 남긴다.
            core.setOutput("ready", "true");
            core.setOutput("success", allSuccess ? "true" : "false");
            core.setOutput("codereview_line", codeReviewLine);
            core.setOutput("failed_workflows", failedLines);
            core.setOutput("notify_title", notifyTitle);
            core.setOutput("ci_line", ciLine);
            core.setOutput("pr_number", prNumber ? String(prNumber) : "");

      - name: 유저 매핑 파싱
        id: map
        if: steps.check.outputs.ready == 'true'
        continue-on-error: true
        env:
          LOGIN: ${{ github.event.workflow_run.actor.login }}
          DISCORD_USER_MAP: ${{ secrets.DISCORD_USER_MAP }}
        run: |
          DISCORD_ID=$(echo "$DISCORD_USER_MAP" | jq -r --arg l "$LOGIN" '.[$l] // empty')
          if [ -n "$DISCORD_ID" ]; then
            echo "mention=<@$DISCORD_ID>" >> "$GITHUB_OUTPUT"
          else
            echo "mention=@$LOGIN" >> "$GITHUB_OUTPUT"
          fi

      - name: 유저 매핑 파싱 실패 알림
        id: map-fail-notify
        if: steps.check.outputs.ready == 'true' && steps.map.outcome == 'failure'
        # 이 curl이 실패해도(웹훅 일시 장애 등) 잡 상태가 failure로 전환되면
        # 뒤따르는 성공/실패 알림·마커 등록 스텝(if에 success()/failure() 명시 없음)이
        # 암묵적 success() 조건 때문에 전부 스킵돼버린다. 그걸 막기 위해 continue-on-error.
        # (대신 가시성은 잡 맨 끝의 "매핑 실패 경고 발송 결과 반영" 스텝에서 복구한다.)
        continue-on-error: true
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          jq -n \
            --arg branch "$BRANCH" \
            '{
              embeds: [{
                title: "⚠️ Discord 유저 매핑 파싱 실패",
                description: "DISCORD_USER_MAP 시크릿 파싱에 실패했습니다. JSON 형식을 확인해주세요. (이후 알림은 멘션 없이 발송됩니다)",
                color: 16776960,
                fields: [
                  { name: "🌱 브랜치", value: ("`" + $branch + "`"), inline: true }
                ]
              }]
            }' > payload.json
          curl -sS -f --connect-timeout 5 --max-time 15 -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d @payload.json

      - name: 성공 알림 (리뷰 요청)
        id: notify-success
        if: steps.check.outputs.ready == 'true' && steps.check.outputs.success == 'true'
        env:
          NOTIFY_TITLE: ${{ steps.check.outputs.notify_title }}
          PR_TITLE: ${{ github.event.workflow_run.display_title }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          CI_LINE: ${{ steps.check.outputs.ci_line }}
          CODEREVIEW_LINE: ${{ steps.check.outputs.codereview_line }}
        run: |
          jq -n \
            --arg title "$NOTIFY_TITLE" \
            --arg pr "$PR_TITLE" \
            --arg branch "$BRANCH" \
            --arg ci "$CI_LINE" \
            --arg cr "$CODEREVIEW_LINE" \
            '{
              embeds: [{
                title: $title,
                color: 5763719,
                fields: ([
                  { name: "🔖 PR", value: $pr, inline: false },
                  { name: "🌱 브랜치", value: ("`" + $branch + "`"), inline: true },
                  { name: "CI", value: $ci, inline: true }
                ] + (if $cr != "" then [{ name: "AI 코드리뷰", value: $cr, inline: true }] else [] end)),
                footer: { text: "👀 리뷰 부탁드립니다!" }
              }]
            }' > payload.json
          curl -sS -f --connect-timeout 5 --max-time 15 -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d @payload.json

      - name: 실패 알림
        id: notify-failure
        if: steps.check.outputs.ready == 'true' && steps.check.outputs.success == 'false'
        env:
          MENTION: ${{ steps.map.outputs.mention }}
          PR_TITLE: ${{ github.event.workflow_run.display_title }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          FAILED: ${{ steps.check.outputs.failed_workflows }}
          CODEREVIEW_LINE: ${{ steps.check.outputs.codereview_line }}
        run: |
          MENTION="${MENTION:-담당자 확인 필요 (매핑 실패)}"
          jq -n \
            --arg pr "$PR_TITLE" \
            --arg branch "$BRANCH" \
            --arg mention "$MENTION" \
            --arg failed "$FAILED" \
            --arg cr "$CODEREVIEW_LINE" \
            '{
              embeds: [{
                title: "🔥 CI 실패",
                color: 15548997,
                fields: ([
                  { name: "🔖 PR", value: $pr, inline: false },
                  { name: "🌱 브랜치", value: ("`" + $branch + "`"), inline: true },
                  { name: "⚠️ 확인 요망", value: $mention, inline: true },
                  { name: "📄 실패한 워크플로", value: $failed, inline: false }
                ] + (if $cr != "" then [{ name: "AI 코드리뷰", value: $cr, inline: false }] else [] end))
              }]
            }' > payload.json
          curl -sS -f --connect-timeout 5 --max-time 15 -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d @payload.json

      # 실제 Discord 발송(성공/실패 알림 중 하나)이 끝난 뒤에만 마커를 남긴다.
      # curl이 실패하면 해당 스텝의 outcome이 'failure'가 되어 이 스텝이 건너뛰어지므로,
      # 발송에 실패한 경우 마커도 남지 않아 다음 트리거가 재시도할 수 있다.
      - name: 발송 완료 마커 등록
        if: steps.notify-success.outcome == 'success' || steps.notify-failure.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            // 이 커밋 상태는 PR 체크 목록에 그대로 노출된다. 중복 발송 판단은
            // context 존재 여부만으로 하고 state 값은 안 보므로(위쪽 "check" 스텝 참고),
            // state를 무조건 success로 고정할 이유가 없다 — 실제 CI 결과를 반영해서
            // PR에서도 CI 실패가 실패로 보이게 한다.
            const allSuccess = "${{ steps.check.outputs.success }}" === "true";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.workflow_run.head_sha,
              state: allSuccess ? "success" : "failure",
              context: "discord-notify",
              description: allSuccess
                ? "Discord 알림 발송됨 (CI 통과)"
                : "Discord 알림 발송됨 (CI 실패 — 위 CI 체크 확인)",
            });

            // 성공 알림을 실제로 보낸 경우에만 "이 PR엔 성공 알림을 보냈다" 라벨을 남긴다.
            // 다음에 리뷰 중 커밋이 추가되어 다시 통과해도 위쪽 "check" 스텝이 이 라벨을 보고
            // 성공 알림을 건너뛴다. 라벨링은 부가 기능이라 실패해도 마커 등록 자체는 막지 않는다.
            const prNumber = "${{ steps.check.outputs.pr_number }}";
            if (allSuccess && prNumber) {
              const label = "discord-ci-passed";
              const addLabel = () => github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: Number(prNumber),
                labels: [label],
              });
              try {
                // 보통은 라벨이 이미 존재하므로(최초 1회 이후) 바로 부여만 시도해서
                // API 호출을 1번으로 끝낸다. 라벨 자체가 없을 때(404)만 만들고 재시도한다.
                await addLabel();
              } catch (err) {
                if (err.status !== 404) {
                  core.warning(`discord-ci-passed 라벨 추가 실패: ${err.message}`);
                } else {
                  try {
                    await github.rest.issues.createLabel({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      name: label,
                      color: "0e8a16",
                      description: "성공 알림을 이미 보낸 PR (리뷰 중 재알림 방지용)",
                    });
                    await addLabel();
                  } catch (err2) {
                    core.warning(`discord-ci-passed 라벨 추가 실패: ${err2.message}`);
                  }
                }
              }
            }

      # 매핑 실패 경고(continue-on-error)가 실제로 실패했었다면, 핵심 알림이 끝난 지금
      # 시점에 잡을 일부러 실패시켜 Actions 탭에서 빨간 X로 드러나게 한다.
      # always()가 있어 앞 스텝들의 성공/실패와 무관하게 실행되므로, 위쪽 알림 스텝들을
      # 막지 않으면서 가시성만 되살릴 수 있다.
      - name: 매핑 실패 경고 발송 결과 반영
        if: always() && steps.map-fail-notify.outcome == 'failure'
        run: |
          echo "::error::유저 매핑 파싱 실패 경고를 Discord로 보내지 못했습니다 (DISCORD_USER_MAP/DISCORD_WEBHOOK 확인 필요). 핵심 CI 알림 자체는 정상 발송되었습니다."
          exit 1

  merge-notify:
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: 머지 알림
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          jq -n \
            --arg pr "$PR_TITLE" \
            --arg head "$HEAD_REF" \
            --arg base "$BASE_REF" \
            '{
              embeds: [{
                title: "🎉 PR 머지됨",
                color: 5793266,
                fields: [
                  { name: "🏷️ PR", value: $pr, inline: false },
                  { name: "➡️ 브랜치", value: ($head + " → " + $base), inline: false }
                ]
              }]
            }' > payload.json
          curl -sS -f --connect-timeout 5 --max-time 15 -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d @payload.json
