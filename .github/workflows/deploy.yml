name: Deploy Backend

# main 에 백엔드/인프라 변경이 머지되면 이미지 빌드 → GHCR → EC2 배포.
# 프론트는 Cloudflare Pages Git 연동이 자체 처리하므로 여기 없음.
on:
  push:
    branches: [main]
    paths:
      - 'back/**'
      - 'infra/docker/**'
      - 'infra/compose/**'
      - 'infra/nginx/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write # AWS OIDC

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: |
          echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          # GHCR 는 소문자만 허용 → 리포 경로를 소문자로
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/back" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3 # arm64 크로스 빌드
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./back
          file: ./infra/docker/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Trigger deploy via SSM
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail

          # 18:00~다음날 03:30 사이엔 인스턴스가 꺼져 있을 수 있음 → 켜고 SSM 준비 대기
          STATE=$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].State.Name' --output text)
          if [ "$STATE" != "running" ]; then
            echo "instance is $STATE — starting"
            aws ec2 start-instances --instance-ids "$INSTANCE_ID"
            aws ec2 wait instance-running --instance-ids "$INSTANCE_ID"
            for _ in $(seq 1 20); do
              PING=$(aws ssm describe-instance-information \
                --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
                --query 'InstanceInformationList[0].PingStatus' --output text 2>/dev/null || echo None)
              [ "$PING" = "Online" ] && break
              echo "waiting for SSM agent ($PING)..."; sleep 15
            done
          fi

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "deploy $TAG" \
            --timeout-seconds 600 \
            --parameters "commands=['sudo -u ec2-user bash /opt/team1-app/deploy.sh $TAG']" \
            --query 'Command.CommandId' --output text)
          echo "command: $CMD_ID"

          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" || true

          echo "----- stdout -----"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query 'StandardOutputContent' --output text
          echo "----- stderr -----"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query 'StandardErrorContent' --output text

          STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query 'Status' --output text)
          echo "status: $STATUS"
          test "$STATUS" = "Success"
