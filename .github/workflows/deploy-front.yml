name: Deploy Frontend

# Cloudflare Workers(assets) 쪽 Git 연동(Workers Builds)이 빌드/배포가 끊겨 대체
# front/wrangler.jsonc 기준 `wrangler deploy`

on:
  push:
    branches: [main]
    paths:
      - 'front/**'
      - '.github/workflows/deploy-front.yml'
  workflow_dispatch:

concurrency:
  group: deploy-front-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: ./front
    steps:
      - uses: actions/checkout@v4

      # package.json 의 packageManager 필드를 읽어 로컬과 같은 pnpm 버전을 쓴다.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: 'front/package.json'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: 'front/.nvmrc'
          cache: 'pnpm'
          cache-dependency-path: 'front/pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify required repository variables
        run: |
          missing=""
          [ -z "${{ vars.VITE_API_BASE_URL }}" ] && missing="$missing VITE_API_BASE_URL"
          [ -z "${{ vars.VITE_GOOGLE_CLIENT_ID }}" ] && missing="$missing VITE_GOOGLE_CLIENT_ID"
          [ -z "${{ vars.VITE_NAVER_CLIENT_ID }}" ] && missing="$missing VITE_NAVER_CLIENT_ID"
          if [ -n "$missing" ]; then
            echo "Missing repository variables:$missing" >&2
            exit 1
          fi

      # 공개 도메인/OAuth client id이라 secret 대신 vars 로 사용.
      - name: Write production env
        run: |
          echo "VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}" > .env.production
          echo "VITE_GOOGLE_CLIENT_ID=${{ vars.VITE_GOOGLE_CLIENT_ID }}" >> .env.production
          echo "VITE_NAVER_CLIENT_ID=${{ vars.VITE_NAVER_CLIENT_ID }}" >> .env.production

      - name: Build
        run: pnpm run build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: front
          wranglerVersion: '^4.130.0'
          command: deploy
