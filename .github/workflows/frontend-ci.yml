name: Frontend CI

on:
  push:
    branches: [ "main", "dev" ]
    paths:
      - 'front/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ "main", "dev" ]
    paths:
      - 'front/**'
      - '.github/workflows/frontend-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      issues: write

    defaults:
      run:
        working-directory: ./front

    steps:
      - uses: actions/checkout@v4

      # package.json 의 packageManager 필드를 읽어 로컬과 같은 pnpm 버전을 쓴다.
      # 이 저장소는 package.json 이 front/ 아래에 있으므로 경로를 명시해야 한다
      # (기본값은 저장소 루트라 그대로 두면 파일을 찾지 못한다)
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: 'front/package.json'

      # 버전을 워크플로에 적지 않고 front/.nvmrc 를 읽는다.
      # 로컬과 CI 가 같은 파일 하나를 보므로 버전이 어긋날 수 없다.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: 'front/.nvmrc'
          cache: 'pnpm'
          cache-dependency-path: 'front/pnpm-lock.yaml'

      # lockfile 과 어긋나면 조용히 재작성하지 않고 실패시킨다
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 타입 에러와 빌드 실패는 머지를 막는다 (백엔드의 컴파일·테스트에 대응)
      - name: Build
        run: pnpm build

      # 린트와 포맷은 경고만 한다 (백엔드의 Checkstyle·Spotless 정책과 동일)
      - name: Lint
        id: lint
        continue-on-error: true
        run: pnpm lint

      - name: Format check
        id: format
        continue-on-error: true
        run: pnpm format:check

      - name: Generate Lint Summary
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          FORMAT_OUTCOME: ${{ steps.format.outcome }}
        with:
          script: |
            const MARKER = '## 🎨 프론트 코드 스타일 리포트';

            const lintFailed = process.env.LINT_OUTCOME === 'failure';
            const formatFailed = process.env.FORMAT_OUTCOME === 'failure';

            let body = `${MARKER}\n\n`;

            if (formatFailed) {
              body += `⚠️ **포맷 위반이 있습니다.** \`pnpm format\` 을 실행한 뒤 커밋해주세요.\n\n`;
            } else {
              body += `✅ 포맷 통과\n\n`;
            }

            if (lintFailed) {
              body += `⚠️ **ESLint 위반이 있습니다.** Actions 로그에서 상세 내용을 확인해주세요.\n`;
            } else {
              body += `✅ ESLint 통과\n`;
            }

            body += `\n> 이 리포트는 경고입니다. 머지를 막지 않습니다. 빌드(\`pnpm build\`) 실패만 머지를 막습니다.`;

            const comments = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const existing = comments.data.find(
              c => c.user.type === 'Bot' && c.body.includes(MARKER)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                comment_id: existing.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }
